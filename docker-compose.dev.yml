version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER}/nicat-backend:${TAG}
    container_name: nicat-backend-dev
    ports:
      - "8098:8080"  # Expose port 8080 of backend to port 8081 of the host
    environment:
      - SPRING_PROFILES_ACTIVE=dev  # Set profile to dev
    networks:
      - nicat-dev-network

networks:
  nicat-dev-network:
    driver: bridge
